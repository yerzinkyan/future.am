services:
  web:
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    image: docker.future.am/flask_future_am_06.11.2026
    restart: unless-stopped
    ports:
      - "7070:7070"
    environment:
      - FLASK_APP=app.py
      - FLASK_DEBUG=0
      - SECRET_KEY=${SECRET_KEY}
    env_file:
      - .env
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"