<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <title>Մուտք — FPS Admin</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0b0b0c;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .login-box {
            background: #171513;
            padding: 2.5rem;
            border-radius: 10px;
            border: 1px solid rgba(198, 161, 91, 0.3);
            width: 320px;
        }
        h2 {
            color: #f6f1e6;
            text-align: center;
            margin-top: 0;
        }
        input {
            width: 100%;
            padding: 0.6rem;
            margin: 0.5rem 0;
            border-radius: 6px;
            border: 1px solid #444;
            background: #0b0b0c;
            color: #f6f1e6;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 0.7rem;
            margin-top: 0.8rem;
            border: none;
            border-radius: 6px;
            background: #9a1b2e;
            color: #f6f1e6;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background: #7a1524;
        }
        .error {
            color: #ff8080;
            text-align: center;
            margin-top: 0.5rem;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>FPS Admin</h2>
        <form method="POST">
            <input type="text" name="username" placeholder="Մուտքանուն" required autofocus>
            <input type="password" name="password" placeholder="Գաղտնաբառ" required>
            <button type="submit">Մուտք</button>
        </form>
        {% if error %}<p class="error">{{ error }}</p>{% endif %}
    </div>
</body>
</html>
